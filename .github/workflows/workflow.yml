name: Pipeline CI/CD

on:
  push:
    branches: [ "master", "env/homologacao" ]

jobs:
  construir:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:14.2-alpine
        env:
          POSTGRES_DB: clinic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Executar build com Maven
        run: mvn clean package

      - name: Rodar um comando
        run: echo "Concluído"